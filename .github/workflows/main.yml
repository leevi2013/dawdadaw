package de.bluegamba;

import net.minecraft.client.gui.DrawContext;
import net.minecraft.client.gui.screen.Screen;
import net.minecraft.client.gui.widget.ButtonWidget;
import net.minecraft.client.gui.widget.TextFieldWidget;
import net.minecraft.item.Item;
import net.minecraft.item.ItemStack;
import net.minecraft.item.Items;
import net.minecraft.text.Text;

import java.util.Random;

public class GambaScreen extends Screen {

    private static final Item[] ORES = {
            Items.COAL_ORE,
            Items.IRON_ORE,
            Items.GOLD_ORE,
            Items.DIAMOND_ORE,
            Items.EMERALD_ORE,
            Items.ANCIENT_DEBRIS
    };

    private static final String[] NAMES = {
            "Kohle", "Eisen", "Gold",
            "Diamant", "Smaragd", "Netherit"
    };

    private static final double[] MULTIPLIERS = {
            0.5, 1.2, 2.0, 5.0, 10.0, 25.0
    };

    private final Random random = new Random();

    private long coins = 1000;
    private long bet = 100;

    private int[] shown = {0, 1, 2};
    private int[] result = {0, 1, 2};

    private int spinTicks = 0;
    private int spinDuration = 0;
    private boolean spinning = false;

    private String status =
            "Einsatz eingeben und DREHEN druecken.";

    private TextFieldWidget betField;
    private ButtonWidget spinButton;
    private ButtonWidget minusButton;
    private ButtonWidget plusButton;

    public GambaScreen() {
        super(Text.literal("Blue Gamba"));
    }

    @Override
    protected void init() {
        int center = width / 2;
        int top = height / 2 - 105;

        betField = new TextFieldWidget(
                textRenderer,
                center - 45,
                top + 130,
                90,
                20,
                Text.literal("Einsatz")
        );

        betField.setText(Long.toString(bet));
        betField.setMaxLength(19);
        addDrawableChild(betField);

        minusButton = addDrawableChild(
                ButtonWidget.builder(
                        Text.literal("-"),
                        button -> {
                            if (!spinning) {
                                bet = Math.max(1, bet - 10);
                                betField.setText(
                                        Long.toString(bet));
                            }
                        }
                ).dimensions(
                        center - 82, top + 130, 30, 20
                ).build()
        );

        plusButton = addDrawableChild(
                ButtonWidget.builder(
                        Text.literal("+"),
                        button -> {
                            if (!spinning) {
                                bet = Math.min(
                                        Long.MAX_VALUE - 10,
                                        bet + 10
                                );
                                betField.setText(
                                        Long.toString(bet));
                            }
                        }
                ).dimensions(
                        center + 52, top + 130, 30, 20
                ).build()
        );

        spinButton = addDrawableChild(
                ButtonWidget.builder(
                        Text.literal("DREHEN"),
                        button -> spin()
                ).dimensions(
                        center - 55, top + 157, 110, 22
                ).build()
        );

        addDrawableChild(
                ButtonWidget.builder(
                        Text.literal("Schliessen"),
                        button -> close()
                ).dimensions(
                        center - 45, top + 184, 90, 20
                ).build()
        );

        updateControls();
    }

    private void updateControls() {
        if (spinButton != null) {
            spinButton.active = !spinning;
        }

        if (minusButton != null) {
            minusButton.active = !spinning;
        }

        if (plusButton != null) {
            plusButton.active = !spinning;
        }

        if (betField != null) {
            betField.setEditable(!spinning);
        }
    }

    private void spin() {
        if (spinning) {
            return;
        }

        String raw = betField.getText().trim();
        long entered;

        try {
            if (raw.isEmpty()) {
                throw new NumberFormatException();
            }

            entered = Long.parseLong(raw);
        } catch (NumberFormatException exception) {
            status = "Fehler: Ungueltiger Einsatz!";
            BlueGambaClient.message(
                    "§cBlue Gamba: Bitte einen gueltigen Einsatz eingeben."
            );
            return;
        }

        if (entered <= 0) {
            status = "Fehler: Einsatz muss groesser als 0 sein!";
            BlueGambaClient.message(
                    "§cBlue Gamba: Einsatz muss groesser als 0 sein!"
            );
            return;
        }

        if (entered > coins) {
            status = "Nicht genug Coins!";
            BlueGambaClient.message(
                    "§cBlue Gamba: Nicht genug Coins. Kontostand: "
                            + coins
            );
            return;
        }

        bet = entered;
        coins -= entered;

        spinDuration = 40 + random.nextInt(41);
        spinTicks = 0;
        spinning = true;

        status = "Die Walzen drehen sich ...";
        updateControls();
    }

    @Override
    public void tick() {
        super.tick();

        if (!spinning) {
            return;
        }

        spinTicks++;

        if (spinTicks % 2 == 0) {
            for (int i = 0; i < 3; i++) {
                shown[i] = random.nextInt(ORES.length);
            }
        }

        if (spinTicks >= spinDuration) {
            for (int i = 0; i < 3; i++) {
                result[i] = random.nextInt(ORES.length);
                shown[i] = result[i];
            }

            spinning = false;
            finishSpin();
            updateControls();
        }
    }

    private void finishSpin() {
        if (result[0] == result[1]
                && result[1] == result[2]) {

            int symbol = result[0];

            long payout = (long) Math.floor(
                    bet * MULTIPLIERS[symbol]
            );

            coins += payout;

            status = "GEWINN! 3x " + NAMES[symbol]
                    + " | Auszahlung: " + payout + " Coins";
        } else {
            status = "Keine drei gleichen Symbole. Einsatz verloren.";
        }
    }

    @Override
    public void render(
            DrawContext context,
            int mouseX,
            int mouseY,
            float delta
    ) {
        renderBackground(context, mouseX, mouseY, delta);

        int cx = width / 2;
        int top = height / 2 - 105;
        int left = cx - 145;
        int right = cx + 145;

        context.fill(
                left, top, right, top + 215, 0xFF101A2B
        );

        context.fill(
                left + 4, top + 4,
                right - 4, top + 30,
                0xFF164B91
        );

        context.drawCenteredTextWithShadow(
                textRenderer, title, cx, top + 12, 0xFFFFFFFF
        );

        for (int x = left + 5; x < right - 5; x += 18) {
            context.fill(
                    x, top + 35, x + 14, top + 49,
                    0xFF356FC1
            );

            context.fill(
                    x, top + 91, x + 14, top + 105,
                    0xFF356FC1
            );
        }

        context.fill(
                left + 5, top + 35,
                left + 19, top + 105,
                0xFF356FC1
        );

        context.fill(
                right - 19, top + 35,
                right - 5, top + 105,
                0xFF356FC1
        );

        context.drawCenteredTextWithShadow(
                textRenderer,
                "MITTLERE REIHE ZAHLT",
                cx, top + 54, 0xFFB7D9FF
        );

        int[] positions = {
                cx - 76, cx - 8, cx + 60
        };

        for (int i = 0; i < 3; i++) {
            int x = positions[i];

            context.fill(
                    x - 5, top + 62,
                    x + 25, top + 92,
                    0xFF07101D
            );

            context.drawItem(
                    new ItemStack(ORES[shown[i]]),
                    x, top + 67
            );
        }

        context.drawCenteredTextWithShadow(
                textRenderer,
                "Coins: " + coins + " | Einsatz: " + bet,
                cx, top + 112, 0xFFFFD966
        );

        context.drawCenteredTextWithShadow(
                textRenderer,
                "Kohle 0,5x | Eisen 1,2x | Gold 2x",
                cx, top + 120, 0xFFE3EFFF
        );

        context.drawCenteredTextWithShadow(
                textRenderer,
                "Diamant 5x | Smaragd 10x | Netherit 25x",
                cx, top + 130, 0xFFE3EFFF
        );

        context.drawCenteredTextWithShadow(
                textRenderer,
                status,
                cx, top + 202, 0xFFFFFFFF
        );

        super.render(context, mouseX, mouseY, delta);
    }

    @Override
    public boolean shouldPause() {
        return false;
    }
}


