      - name: Build mod
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: bluegamba-jar
          path: build/libs/*.jar


===== DATEI: README.md =====

# Blue Gamba - Minecraft Fabric Mod

Minecraft Java 1.21.11 / Java 21.

## Funktionen

- GUI mit Taste G oeffnen
- Blaues Slot-GUI
- 1000 virtuelle Start-Coins
- Einsatzschutz gegen 0 und negative Werte
- Drehdauer: 2 bis 4 Sekunden
- Gewinn nur bei drei gleichen Erzen
- Kohle: 0.5x
- Eisen: 1.2x
- Gold: 2x
- Diamant: 5x
- Smaragd: 10x
- Ancient Debris: 25x

## Build

Java 21 und Gradle 8.14 benoetigt.

```bash
gradle build
```

Die JAR wird in build/libs erstellt.

